[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "swea-sentinel"
version = "0.1.0"
description = "Governance and engineering intelligence MCP server for AI coding agents"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Proprietary"}
dependencies = [
  "mcp[cli]>=1.12,<2",
  "pydantic>=2.8,<3",
  "PyYAML>=6.0,<7",
  "structlog>=24.4,<26",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-cov>=5.0", "ruff>=0.9", "mypy>=1.13", "types-PyYAML>=6.0"]

[project.scripts]
swea-sentinel = "swea_sentinel.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/swea_sentinel"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
